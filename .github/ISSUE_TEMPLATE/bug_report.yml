name: Bug report
description: Something behaves differently from what it says it does
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security vulnerability, **stop** and report it privately instead —
        see [SECURITY.md](https://github.com/xinweiiiii/agentic-auth/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >-
        The smallest sequence that shows it. A manifest, a request, and the response is
        usually enough.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Control plane (manifests, reconciliation, policy compilation)
        - PDP (authorization decisions)
        - Token exchange
        - Enforcement point - sidecar
        - Enforcement point - gateway
        - Enforcement point - boundary adapter
        - SDK
        - Audit plane
        - Identity and enrollment
        - Taint and provenance
        - Observability (metrics, traces, logs)
        - CLI
        - CI drift check
        - Not sure
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: The decision, if one was made
      description: >-
        If a call was allowed or denied unexpectedly, paste the recorded decision. The
        `reason` and `hop` are the useful parts. Redact anything sensitive.
      render: json
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Python version, OS, and which flags are enabled.
