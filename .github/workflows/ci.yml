name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here needs a secret, and nothing here uses pull_request_target. A fork's pull
# request runs every check below exactly as a branch's does. Keep it that way: the moment
# a required check needs a credential, outside contribution stops working.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback. Split from the suite so a formatting slip reports in about a minute
  # instead of queueing behind six.
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e '.[dev,otel]'

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

      # Three pre-existing errors are expected; see CONTRIBUTING.md. This reports them
      # without gating, so a real regression is still visible in the log.
      - name: mypy
        run: mypy || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: agentic_auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d agentic_auth"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # [otel] is not optional for the suite: tests/integration/test_telemetry_*.py import
      # the SDK directly and fail at collection without it. The product stays independent
      # of it at runtime, which is what test_observability_optional.py proves.
      - run: python -m pip install -e '.[dev,otel]'

      - name: pytest
        run: pytest -q --durations=10

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
