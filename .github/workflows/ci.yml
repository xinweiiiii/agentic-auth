name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here needs a secret, and nothing here uses pull_request_target. A fork's pull
# request runs every check below exactly as a branch's does. Keep it that way: the moment
# a required check needs a credential, outside contribution stops working.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback. Split from the suite so a formatting slip reports in about a minute
  # instead of queueing behind six.
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e '.[dev,otel]'

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

      # Three pre-existing errors are expected; see CONTRIBUTING.md. This reports them
      # without gating, so a real regression is still visible in the log.
      - name: mypy
        run: mypy || true

      # The editable install above hides packaging mistakes: it imports from the checkout.
      # This is what a consumer, and the drift-check action's default install, actually get.
      # Run from /tmp so the checkout cannot shadow the installed package.
      - name: wheel install
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet '.[all]'
          cd /tmp
          /tmp/wheel-venv/bin/agentic-auth --help
          /tmp/wheel-venv/bin/python -c "import pkgutil, agentic_auth; [__import__(m.name) for m in pkgutil.walk_packages(agentic_auth.__path__, 'agentic_auth.')]"

  # What each install option actually brings, measured on the built wheels in fresh
  # environments: the import boundary of every extra, the missing-extra message, the wheel's
  # top level, and that a project with its own `app` package still imports it. No services:
  # nothing here touches PostgreSQL or Redis.
  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: pytest -m packaging
        run: pytest -m packaging tests/packaging -q

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: agentic_auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d agentic_auth"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # [otel] is not optional for the suite: tests/integration/test_telemetry_*.py import
      # the SDK directly and fail at collection without it. The product stays independent
      # of it at runtime, which is what test_observability_optional.py proves.
      - run: python -m pip install -e '.[dev,otel]'

      # Rich wraps CLI output at the terminal width, and a couple of tests assert on
      # that text. A runner defaults to 80 columns, which splits "does not exist" across
      # a line break and fails an assertion about the message, not about the behaviour.
      # Pinning the width makes the output deterministic everywhere.
      - name: pytest
        env:
          COLUMNS: "120"
        run: pytest -q --durations=10

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The binary, not gitleaks-action: the action needs GITHUB_TOKEN to scan a pull
      # request, and no check here may depend on a secret. Pinned by version and checksum.
      - name: gitleaks
        env:
          VERSION: 8.24.3
          SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --config .gitleaks.toml --redact --verbose .
