[project]
name = "authzai-compat"
# Must equal agentic_auth.__version__; tests/unit/test_versions_agree.py fails if they drift.
version = "0.2.0rc1"
description = "Deprecated app.* import aliases for authzai, for code written against 0.1.x. Removed in 0.3.0."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Wong Xin Wei" }]
readme = "README.md"
dependencies = ["authzai==0.2.0rc1"]

[project.urls]
Source = "https://github.com/xinweiiiii/agentic-auth"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
