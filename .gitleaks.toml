# gitleaks configuration.
#
# Every entry below is an exclusion, so every entry needs a reason. The rule is: an
# allowlist entry names WHY the match is not a secret, and a reviewer can check that
# claim without running anything. A path added here without a reason is a defect.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|password)[\w.-]{0,20}['"\s:=]{1,3}([0-9a-zA-Z\-_=]{16,64})'''
secretGroup = 1
[rules.allowlist]
regexTarget = "line"
regexes = [
  # Type annotations, not values: `private_key: Ed25519PrivateKey`, `key: Ed25519PrivateKey`.
  # The name before the colon is a field; the text after it is a type.
  '''(?:private_key|key)\s*:\s*Ed25519(?:Private|Public)Key''',
  # Keys generated at runtime by the test, example and dev-fallback paths. The call
  # creates a key in memory; no secret material is written down anywhere.
  '''Ed25519PrivateKey\.generate''',
]

[allowlist]
description = "Documented placeholders and synthetic test material"
paths = [
  # Asserts that secrets do NOT reach telemetry. Its fixtures are deliberately
  # token-shaped; the signatures are the literals "bogus-signature" and base64
  # "signature-here". A real secret here would fail the test it belongs to.
  '''tests/integration/test_no_secrets_in_telemetry\.py''',
]
regexes = [
  # The dev placeholder shipped in .env.example as AGENTIC_AUTH_ADMIN_TOKEN. It is a
  # documented local default, printed in the quickstart, and grants nothing anywhere else.
  '''dev-admin-token''',
]
