[project]
name = "authzai"
dynamic = ["version"]
description = "Authorization for AI agents: per-hop narrowing authority, verifiable delegation chains, and an append-only audit log"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Wong Xin Wei" }]
readme = "README.md"
keywords = ["authorization", "ai-agents", "oauth", "rfc8693", "zero-trust", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# The base install is the offline verifier (agentic_auth.verify) and nothing else, so a tool
# owner that only checks tokens gets four packages, not a web server and a database driver.
# Every other surface is an extra below; importing one without it names the extra
# (agentic_auth/_extras.py). The import boundary of each is asserted by
# tests/packaging/test_import_boundaries.py against the built wheel.
dependencies = [
    "pyjwt[crypto]>=2.9",
]

[project.urls]
Homepage = "https://authzai.dev"
Documentation = "https://authzai.dev"
Source = "https://github.com/xinweiiiii/agentic-auth"
Issues = "https://github.com/xinweiiiii/agentic-auth/issues"

[project.scripts]
agentic-auth = "agentic_auth.cli:main"
agentic-auth-sidecar = "agentic_auth.sidecar.__main__:main"
agentic-auth-gateway = "agentic_auth.gateway.__main__:main"
agentic-auth-boundary = "agentic_auth.boundary.__main__:main"

[project.optional-dependencies]
# The agent-side SDK against a remote control plane: agentic_auth.sdk.
client = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]
# The `agentic-auth` CLI and the CI drift check (agentic_auth.sdk.drift). What the drift-check
# GitHub Action installs, so it stays free of the server stack.
drift = [
    "authzai[client]",
    "typer>=0.12",
    "rich>=13.7",
    # Drift metrics written to a textfile.
    "prometheus-client>=0.21",
]
# The whole control plane in one process, for development and tests: agentic_auth.embedded.
# The real FastAPI app on SQLite and an in-process Redis; no server, no ports.
embedded = [
    "authzai[client]",
    # Upper bound is load-bearing, not caution. From 0.142.0 FastAPI imports opentelemetry
    # at import time (fastapi/telemetry/_api.py), which breaks this project's guarantee
    # that the observability layer is optional and the control plane builds without the
    # OTel SDK installed. 0.141.1 is the last version that does not; verified by bisecting
    # 0.141.1 -> 0.162 against an import blocker.
    # tests/unit/test_observability_optional.py asserts that guarantee and fails above it.
    # Raising this bound means fixing that test first, or dropping the guarantee.
    "fastapi>=0.115,<0.142",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    # fakeredis depends on the redis client, which the services import for their types.
    "redis>=5.0",
    "fakeredis>=2.26",
    # RFC 8693 token exchange is form-encoded; FastAPI needs this to parse Form().
    "python-multipart>=0.0.9",
    # Decision, audit and drift metrics.
    "prometheus-client>=0.21",
]
# The deployable control plane, sidecar, gateway and boundary adapter, on PostgreSQL and Redis.
server = [
    "authzai[embedded,drift]",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
]
all = [
    "authzai[server,otel]",
]
# Everything needed to run examples/e2e-notebook/customer_walkthrough.ipynb.
notebook = [
    "authzai[embedded]",
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbclient>=0.10",
]
dev = [
    "authzai[all]",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "ruff",
    "mypy",
    "mutmut",
    "locust",
    "jsonschema",
    "build",
    "twine",
]

# Traces and logs. Deliberately NOT a base dependency:
# AGENTIC_AUTH_TELEMETRY_ENABLED defaults to false, agentic_auth/observability imports these lazily,
# and the whole layer degrades to a no-op when they are absent.
#
# Metrics are NOT here. They stay on prometheus-client, which the drift and embedded extras install, because
# PrometheusMetricReader adds otel_scope_* labels and a target_info series, registers a second
# writer into one CollectorRegistry, and has no PROMETHEUS_MULTIPROC_DIR equivalent — any of
# which breaks the published Phase 3/4 metric names. structlog is not here
# either: stdlib logging's `extra=` already exports as structured attributes through
# OTel's LoggingHandler.
otel = [
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Discover every subpackage. A bare `packages = ["agentic_auth"]` ships agentic_auth/__init__.py and its
# siblings only, which an editable install hides and a wheel install does not.
[tool.setuptools.packages.find]
include = ["agentic_auth*"]

# One source for the version: agentic_auth.__version__. compat/pyproject.toml pins the same
# number, and tests/unit/test_versions_agree.py fails if the two drift.
[tool.setuptools.dynamic]
version = { attr = "agentic_auth.__version__" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mutants", "migrations/versions", "docs", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"agentic_auth/cli/*" = ["B008"]  # typer uses callables in argument defaults by design
# Entry points that check for their install option before importing it (agentic_auth/_extras.py).
# The check has to run first, so the imports after it are deliberately not at the top.
"agentic_auth/cli/__init__.py" = ["B008", "E402"]
"agentic_auth/main.py" = ["E402"]
"agentic_auth/sdk/__init__.py" = ["E402"]
"agentic_auth/sdk/drift.py" = ["E402"]
"agentic_auth/embedded/__init__.py" = ["E402"]
"tests/*" = ["B008"]
# Runnable walkthrough scripts: they put the package on sys.path before importing it.
"examples/phase4-e2e/*" = ["E402", "E401", "E501"]
# The notebook's local stack must configure the environment before importing the app.
"examples/e2e-notebook/*" = ["E402"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["agentic_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# `packaging` builds the wheels and installs them into fresh environments: slow and
# network-bound, so CI runs it as its own job (`pytest -m packaging tests/packaging`).
addopts = "-m 'not packaging'"
markers = [
    "packaging: installs the built wheels into fresh environments (deselected by default)",
    "conformance: a scenario run identically against the remote and embedded deployments",
]

[tool.mutmut]
# Directories mutmut copies + mutates one mutation at a time.
source_paths = [
    "agentic_auth/services/reconciler.py",
    "agentic_auth/services/dag_compiler.py",
    "agentic_auth/services/pdp.py",
    "agentic_auth/services/tokens/act_chain.py",
    "agentic_auth/services/edge_rules.py",
    "agentic_auth/services/audit_chain.py",
    "agentic_auth/services/drift.py",
    # Phase 4 pure modules.
    "agentic_auth/verify/canonical.py",
    "agentic_auth/verify/admit.py",
    "agentic_auth/services/taint.py",
    "agentic_auth/services/enrollment_rules.py",
    # Phase 5 pure modules.
    "agentic_auth/gateway/resolve.py",
    "agentic_auth/services/stepup_rules.py",
    "agentic_auth/coldstart/propose.py",
    "agentic_auth/boundary/guarantee.py",
    # Phase 6 pure modules: a silent mutation here is invisible in the output.
    "agentic_auth/observability/ids.py",
    "agentic_auth/observability/surface.py",
    "agentic_auth/observability/tracing.py",
]

# Passed straight to pytest inside each mutant's sandboxed copy.
pytest_add_cli_args_test_selection = [
    "tests/unit/test_reconciler.py",
    "tests/unit/test_dag_compiler.py",
    "tests/unit/test_dag_compiler_v2.py",
    "tests/unit/test_pdp_matrix.py",
    "tests/unit/test_act_chain.py",
    "tests/unit/test_edge_rules.py",
    "tests/unit/test_edge_rules_parity.py",
    "tests/unit/test_audit_chain.py",
    "tests/unit/test_drift_diff.py",
    # Covers drift.py's loading/compiling entry points, which the pure differ tests do not
    # reach — without these, ~270 mutants in `run_check`/`load_manifest_dirs` run untested.
    "tests/unit/test_drift_cli.py",
    "tests/unit/test_edge_trace.py",
    # Phase 4.
    "tests/unit/test_canonical.py",
    "tests/unit/test_verify_admit.py",
    "tests/unit/test_taint_rules.py",
    "tests/unit/test_pdp_taint_matrix.py",
    "tests/unit/test_enrollment_rules.py",
    "tests/unit/test_pdp_revoked.py",
    "tests/unit/test_phase4_edges.py",
    "tests/unit/test_taint_store.py",
    "tests/unit/test_transaction_token.py",
    # Phase 5.
    "tests/unit/test_gateway_resolve.py",
    "tests/unit/test_stepup_rules.py",
    "tests/unit/test_propose.py",
    "tests/unit/test_guarantee.py",
    "tests/unit/test_pdp_consent_subset.py",
    # Phase 6.
    "tests/unit/test_pseudonymisation.py",
    "tests/unit/test_trace_ids.py",
    "tests/unit/test_sampling_filter.py",
    "tests/unit/test_telemetry_surface.py",
]

# Files mutmut still needs alongside the mutated modules to make the test run
# work: the rest of the app package (imported by reconciler/dag_compiler) and
# the test suite + fixtures.
also_copy = [
    "tests/",
    "agentic_auth/",
]

# Skip mutating things that aren't worth the runtime: migrations,
# logging calls, and defensive raises that tests won't assert on.
do_not_mutate_patterns = [
    'logger\.\w+',
    'raise \w+',
]

# A mutant survives ~15x the baseline suite duration and is called
# a timeout instead of retried forever.
timeout_constant = 1.0
timeout_multiplier = 15.0
